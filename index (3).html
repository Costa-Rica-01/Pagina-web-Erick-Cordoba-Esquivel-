    <!-- =========================================
         PROTECCIÓN BÁSICA
    ========================================== -->

    <script>

        // Desactivar click derecho
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });


        // Desactivar teclas de inspector
        document.onkeydown = function(e) {

            // F12
            if (e.keyCode === 123) {
                return false;
            }

            // CTRL + SHIFT + I
            if (
                e.ctrlKey &&
                e.shiftKey &&
                e.keyCode === 73
            ) {
                return false;
            }

            // CTRL + SHIFT + J
            if (
                e.ctrlKey &&
                e.shiftKey &&
                e.keyCode === 74
            ) {
                return false;
            }

            // CTRL + U
            if (
                e.ctrlKey &&
                e.keyCode === 85
            ) {
                return false;
            }

        };


        // Desactivar arrastrar imágenes
        document.addEventListener("dragstart", function(e) {
            e.preventDefault();
        });


        // Desactivar selección de texto
        document.onselectstart = function() {
            return false;
        };


        // Ofuscación básica en consola
        (function() {

            const html =
                document.documentElement.innerHTML;

            const encoded =
                btoa(
                    unescape(
                        encodeURIComponent(html)
                    )
                );

            console.log(
                "Código protegido (Base64):",
                encoded
            );

        })();

    </script>
